<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} — Ali Balighi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --text-main: #f4f0eb;
            --text-dim: #cccccc;
            --text-muted: #999999;
            --accent-color: #ff2a2a;
            --border-color: rgba(244, 240, 235, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            color-scheme: dark;
            scroll-behavior: smooth;
        }

        /* --- CORE STYLES --- */
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Cormorant Garamond', serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        a { color: inherit; }

        a[target="_blank"]::after {
            content: " ↗";
            font-size: 0.72em;
            vertical-align: 0.12em;
        }

        :focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 4px;
        }

        .skip-link {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10000;
            transform: translateY(-160%);
            background: var(--text-main);
            color: #000000;
            padding: 10px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            text-decoration: none;
        }

        .skip-link:focus { transform: translateY(0); }

        /* Page Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #444444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        /* --- UI LAYOUT (Menu & Title) --- */
        .site-header {
            display: flex;
            width: 100%;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 38px 20px 24px;
        }

        .menu, .social-menu {
            display: flex;
            max-width: 1000px;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .social-menu {
            gap: 4px;
        }

        .highlight {
            min-height: 36px;
            border: 1px solid transparent;
            color: #ffffff;
            cursor: pointer;
            font: 500 15px/1.3 'Cormorant Garamond', Georgia, serif;
            letter-spacing: 1.5px;
            padding: 8px 11px;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            user-select: none;
        }

        .social-menu .highlight {
            color: var(--text-dim);
            font-size: 13px;
        }

        .social-menu .icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .social-menu .icon-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            display: block;
        }

        .highlight:hover,
        .highlight[aria-current="page"] {
            color: var(--accent-color);
            border-color: rgba(255, 42, 42, 0.55);
            background: rgba(255, 42, 42, 0.08);
        }

        .highlight[aria-current="page"] {
            cursor: default;
        }

        /* --- IDENTITY / TITLE STYLES --- */
        .identity {
            text-align: center;
        }

        .identity .site-name {
            display: inline-block;
            margin: 0;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 54px;
            font-weight: 500;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
            line-height: 1;
        }

        .subtitle-text {
            font-size: 13px;
            color: #aaaaaa;
            margin: 12px 0 0;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        /* --- MAIN CONTENT & POST STYLES --- */
        main {
            max-width: 760px;
            margin: 20px auto 60px auto;
            padding: 0 30px;
        }

        h1, h2, h3 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        h1 { font-size: 42px; }
        h2 { font-size: 28px; margin-top: 40px; }

        main p {
            font-size: 20px;
            line-height: 1.6;
            text-align: justify;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        main strong {
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Link styling matched to main code */
        main a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-color);
            transition: all 0.2s;
        }

        main a:hover {
            border-bottom-style: solid;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.4);
        }

        hr {
            border: 0;
            border-top: 1px dashed var(--text-dim);
            margin: 40px 0;
        }

        /* Blog List Specific Overrides */
        .post-meta {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .post-list { list-style: none; }
        .post-list li {
            border-bottom: 1px dashed rgba(244, 240, 235, 0.15);
            padding: 30px 0;
        }
        .post-list h2 a {
            color: var(--text-main);
            transition: color 0.3s;
            border-bottom: none; /* Remove dashed border for titles */
        }
        .post-list h2 a:hover {
            color: var(--accent-color);
            text-shadow: none;
            border-bottom: none;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 2px;
            border-top: 1px solid rgba(244, 240, 235, 0.05);
            font-family: 'Space Mono', monospace;
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .site-header {
                gap: 14px;
                padding: 24px 14px 18px;
            }

            .menu, .social-menu { gap: 4px; }

            .highlight {
                min-height: 44px;
                padding: 10px;
                font-size: 13px;
                letter-spacing: 1px;
            }

            .social-menu .highlight { font-size: 12px; }

            .identity .site-name { font-size: 38px; }

            .subtitle-text {
                max-width: 600px;
                margin-top: 10px;
                padding: 0 12px;
                font-size: 12px;
            }

            main { padding: 0 20px; margin: 10px auto 40px auto; }
            main p { font-size: 18px; text-align: left; }
        }
    </style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
    <div class="identity">
        <a class="site-name" href="https://alibalighi.com/">Ali Balighi</a>
        <p class="subtitle-text">Composer &amp; scholar — electroacoustic, contemporary, and cross-cultural music</p>
    </div>

    <nav class="menu" aria-label="Primary navigation">
        <a href="https://alibalighi.com/index.html" class="highlight">HOME</a>
        <a href="https://alibalighi.com/about.html" class="highlight">ABOUT</a>
        <a href="https://alibalighi.com/music.html" class="highlight">MUSIC</a>
        <a href="https://alibalighi.com/scores.html" class="highlight">SCORES</a>
        <a href="https://alibalighi.com/articles.html" class="highlight">ARTICLES</a>
        <a href="https://alibalighi.com/books.html" class="highlight">BOOKS</a>
        <a href="https://alibalighi.com/news.html" class="highlight">NEWS</a>
        <a href="https://alibalighi.com/contact.html" class="highlight">CONTACT</a>
    </nav>

    <nav class="social-menu" aria-label="External links">
        <a href="{{ '/' | relative_url }}" class="highlight" aria-current="page">BLOG</a>
        <a href="https://github.com/alib65" target="_blank" rel="noopener noreferrer" class="highlight icon-link" aria-label="Code (GitHub)"><img src="{{ '/icons/code.png' | relative_url }}" alt="" class="icon-img" loading="lazy"></a>
        <a href="https://alibalighi.bandcamp.com/" target="_blank" rel="noopener noreferrer" class="highlight icon-link" aria-label="Bandcamp"><img src="{{ '/icons/bandcamp.png' | relative_url }}" alt="" class="icon-img" loading="lazy"></a>
        <a href="https://www.youtube.com/@AliBalighi" target="_blank" rel="noopener noreferrer" class="highlight icon-link" aria-label="YouTube"><img src="{{ '/icons/youtube.png' | relative_url }}" alt="" class="icon-img" loading="lazy"></a>
        <a href="https://electronicnights.github.io" target="_blank" rel="noopener noreferrer" class="highlight icon-link" aria-label="Electronic Nights"><img src="{{ '/icons/electronicnights.png' | relative_url }}" alt="" class="icon-img" loading="lazy"></a>
    </nav>
</header>

<main id="main-content">
    {{ content }}
</main>

<footer>
    © {{ site.time | date: "%Y" }} Ali Balighi
</footer>

</body>
</html>
